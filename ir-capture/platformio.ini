; Projet de reconnaissance IR - plan §8.0, phases 1 a 3.
; Sert uniquement a identifier le protocole de la telecommande WH-TG01NE.
; Le firmware definitif est un projet ESP-IDF distinct (toshiba-climate-controller/).

[platformio]
default_envs = capture

; L'interface n'est pas dans ce projet : elle vit avec le firmware definitif.
; `uploadfs` la prend directement a la source, il n'y a donc jamais deux copies
; a maintenir (cahier v2 §4.2).
data_dir = ${PROJECT_DIR}/../toshiba-climate-controller/web

[env]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; Le XIAO n'a pas de puce USB-UART : la console passe par l'USB-Serial-JTAG du SoC (plan §7.1.1).
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; --- Capture IR : le croquis de travail (plan §8.0) ---
[env:capture]
build_src_filter = +<main.cpp>
lib_deps = crankyoldgit/IRremoteESP8266

; --- Scanner de broches : outil de diagnostic de cablage ---
;     pio run -e scan -t upload
[env:scan]
build_src_filter = +<pin_scan.cpp>

; --- Auto-detection du TSOP : la carte alimente le composant et trouve
;     l'orientation seule. Voir l'en-tete de autodetect.cpp pour le cablage.
;     pio run -e autodetect -t upload
[env:autodetect]
build_src_filter = +<autodetect.cpp>

; --- Test de l'etage d'emission (plan §6.1) : clignotement lent sur D1, sans
;     porteuse. Verifie a la camera de telephone que le transistor commute.
;     pio run -e txtest -t upload
[env:txtest]
build_src_filter = +<tx_blink.cpp>

; --- Boucle locale (plan §2.3) : emet une trame TOSHIBA_AC sur D1 et la fait
;     redecoder par le TSOP. Seul environnement ou les deux etages sont
;     montes en meme temps.
;     pio run -e loopback -t upload
[env:loopback]
build_src_filter = +<tx_loopback.cpp>
lib_deps = crankyoldgit/IRremoteESP8266

; --- Diagnostic de la porteuse (plan §6.1) : separe le continu de la
;     modulation 38 kHz, PWM materiel, sans la bibliotheque IR. A utiliser
;     quand la boucle locale ne recoit rien.
;     pio run -e carrier -t upload
[env:carrier]
build_src_filter = +<tx_carrier.cpp>

; --- Interface Web sur la carte : sert web/ depuis la flash et emet une vraie
;     trame a chaque commande, verifiee par le TSOP. Demande include/secrets.h.
;     pio run -e webui -t uploadfs     (les fichiers de l'interface)
;     pio run -e webui -t upload       (le firmware)
[env:webui]
build_src_filter = +<webui.cpp>
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
lib_deps =
	crankyoldgit/IRremoteESP8266
	bblanchon/ArduinoJson@^7.0.0
